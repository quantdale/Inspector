confirmed_inspector_defects:
  - id: FIELD-1
    severity: HIGH
    title: >-
      Resume never re-created the environment on the fresh adapter process;
      targeted web runs also lost their spawn-env delta (silent retarget risk)
    status: CLOSED_FIXED
    evidence: >-
      P3 install battery vs installed rc.1: resume of mid-flight killed web run
      exited 1 with observeError 'environment not created' (reattached:false,
      stepsRecorded:105). Core resumeRun issued initialize only; CLI resume of
      fake runs masked it because FakeAdapterHandler.observe tolerates no-create.
    fix_commit: cc0d34b
    regression: >-
      packages/core/src/run-manager.integration.test.ts FIELD-1 test (strict
      lifecycle fixture refuses observe-before-create; asserts create replayed
      with durable options + spawn-env delta reaches new process) + store
      migration #6 columns
  - id: FIELD-2
    severity: MEDIUM
    title: >-
      UIA rehost recovery could not follow a window that migrated to a NEW
      owner pid (C-F2 class): same-pid-only reattach died at Calculator
      'Keep on top' transitions
    status: CLOSED_FIXED
    evidence: >-
      calc-rehost probe: collapse detected honestly (57->1) but reattach failed
      'no top-level window remains' while the pinned surface lived under a new
      owner. Fix: title-evidenced cross-owner fallback + bounded 250ms poll in
      attemptReattach. Keep-on-top pinned surface itself is NOT enumerable at
      desktop root on this Win11 build (keepontop-debug evidence), so that one
      transition still ends in truthful REATTACH_FAILED by design.
    fix_commit: e40fa2d
    regression: windows.stale-window.test.ts C-F2 describe block (3 tests)

environment_findings_not_inspector_defects:
  - id: FIELD-ENV-CAST
    finding: >-
      'Specified cast is not valid.' during UIA Invoke is an APP-side broken
      pattern advertisement on nameless WinUI Pane elements (Win11 Notepad).
      Classification matrix: fails identically through same-bridge retry,
      session reattach, and a brand-new PS/UIA session; every named control
      invokes cleanly. Product behavior honest (error surfaced, exploration
      continued).
    evidence_ref: .inspector/ga-work/hunts/uia-soak/cast-matrix-summary.json
  - id: FIELD-ENV-CONPTY-SHORTPATH
    finding: >-
      Spawning any program through ConPTY (@lydell/node-pty native agent) with
      an 8.3 short-path cwd (os.tmpdir() -> C:\Users\MICHAE~1\...) hard-crashes
      the host process natively (exit 0xFFFFFFFF, zero output). Harnesses now
      sandbox under repo-relative long paths. Not reachable from product code
      paths (CLI hunts never chdir into short paths).


