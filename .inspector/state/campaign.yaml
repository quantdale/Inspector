blockers: []
known_debt:
  - >-
    Replay oracle is loose: TargetFailureOracle counts any target-failure
    outcome (including ACTION_FAILED automation misses) as reproduction, so
    minimization can over-reduce paths that end in a hidden-element miss.
    Partially mitigated by the M4 OracleSuite; full tightening deferred.
  - >-
    Web exploration E2E takes ~4-6 min wall clock (fresh Chromium per replay);
    acceptable for the gate but a candidate for later perf work.
  - >-
    Production bindings for PTY/UIA/Electron-runtime/ADB CLI/emulator remain
    hardening items; injectable contracts proven by mocks per spec blocker
    policies.

