known_debt:
  - >-
    CLOSED_BY_M9: native exploration now uses platform-faithful replay drivers
    and automation failures are excluded from the target-defect pipeline;
    remaining universal oracle/verification coverage is carried into M11.P5.
  - >-
    CLOSED_BY_M10: exploration graphs, RNG/decision state, finding classes,
    action/reset/finding/wall budgets, and checkpoint recovery are durable and
    resumable for web and native campaigns.
  - >-
    CLOSED_BY_M11.P1: verify and regress are now exposed as durable installed
    CLI workflows with replay provenance, stable JSON, and deterministic exit
    classes.
  - >-
    CLOSED_BY_M11.P2: explicit explore is now a durable discovery-only CLI
    workflow with coverage/novelty output and resumable campaign metadata.
  - >-
    CLOSED_BY_M11.P3: explicit repair now invokes the existing RepairEngine
    only with a configured provider, exact revision, detached worktree,
    regression-first gates, masking/test-tamper policy, and durable audit.
  - >-
    CLOSED_BY_M11.P4: bounded `campaign run`, `list`, `show`, `stop`, and
    `resume` are installed-CLI operations over @inspector/scale with explicit
    fake target assignments, SQLite leases by default, global/per-worker
    budgets, and durable idempotent state.
  - >-
    CLOSED_BY_M11.P5: universal automation-failure oracle regression coverage,
    filesystem-aware repair containment (including symlink/junction ancestry),
    deterministic freeform redaction, durable repair-attempt and artifact-byte
    accounting, bounded atomic artifact cleanup, and timestamped web action
    window attribution.
  - >-
    CLOSED_BY_M11.P6: production Electron field proof is proven real on Windows dev host (Electron 43.4.1 lifecycle/renderer/evidence/reset) and under Linux Xvfb in hosted CI (electron-production + electron-fleet campaign lanes, both green on e1e0864 with browser provisioning); honest refusal when executable/display absent; PTY/TUI viewport state is now modeled by a deterministic VT cell grid.
  - >-
    CLOSED_BY_M11.P7: layered Linux/Windows CI is configured; release artifacts
    carry source/platform/dependency provenance and checksums; package-content
    assertions reject workspace/test/secret/temp leakage; clean-prefix smoke
    runs the installed CLI; stable JSON errors, the M11 acceptance matrix, and
    final documentation/state synchronization are complete. HARDENING_4 and HARDENING_5 certified all CI lanes on exact SHAs f687ef1 and e1e0864 (public API verified).
  - >-
    CLOSED_BY_M14: web exploration replay cost now measured and guarded — StateFile fingerprint skip proven via micro-benchmark (noop 4.8ms vs changing 7.3ms, 1.5× speedup) and persistent-driver reuse contract documented; STILL_OPEN debt from M12 is now CLOSED with regression guard (state-file.bench.test.ts + perf-bench script).
  - >-
    CLOSED_BY_M15: release provenance now hermetic — version coherence guard (root vs workspace vs inspector-version.txt) and tarball allowlist (no .inspector/.env/node_modules/.git, no absolute leakage) with 16 deterministic tests (release-provenance.test.ts); build-release.mjs provenance header.
  - >-
    CLOSED_BY_M16: OpenTelemetry-compatible trace/metrics export — FileTraceExporter + InMemoryMetricExporter + RunCounterMetrics, JSON-lines, bounded attributes (128), sanitized, no network, derived not authoritative (otel.ts + otel.test.ts 4 tests).
  - >-
    CLOSED_BY_M17: static HTML evidence report generator — generateDashboard(runs,findings) produces offline self-contained HTML (no JS/fetch, escaped, redacted via redactFreeformText) with deterministic tables (dashboard.ts + dashboard.test.ts 6 tests).
  - >-
    CLOSED_BY_M18: supply-chain and redaction hardening — expanded secret patterns (URL query, bearer, cookie, env, high-entropy sk-/ghp_/xox) with deterministic ArtifactStore scrubbing (redaction.ts) and fail-closed audit guard (no high/critical, unknown blocked) — 12 + 7 + 13 tests.
  - >-
    CLOSED_BY_M19: platform fidelity — Windows UIA 1-node subtree collapse typed as DEAD_WINDOW/REATTACH_FAILED (uia-bridge.test.ts 4 tests), PTY viewport 0/1 clamping and cursor determinism (tui-screen.test.ts 6 tests), Android dump retry bounded cap 3 with transient/permanent discrimination (android.dump-retry.test.ts 3 tests + adapter fix).
  - >-
    CLOSED_BY_M20: visual oracle — deterministic average-hash 8×8 pHash, hammingDistance, visualDiff/isNearDuplicate, VisualOracle class (confidence capped 0.5, never confirms alone) — 7 tests (visual-hash.ts).
  - >-
    CLOSED_BY_M21: distributed fleet lease abstraction — LeaseStore interface with MemoryLeaseStore (shared registry), SqliteLeaseStore, FileLeaseStore, LeaseManager parity across backends (generation fencing, concurrent, restart) — 9 tests (lease-memory.ts + lease-backend.test.ts).
  - >-
    CLOSED_BY_M22: property and mutation testing — finding lifecycle seeded property (CANDIDATE→REPRODUCING→CONFIRMED/REJECTED/FLAKY, REJECTED absorbing, determinism) + replay vocab (environment-failure never REJECTED) with mutant-kill proof, budget admission (admit-before-charge, over-budget denial, concurrent holds, TTL settlement) — 8 + 7 tests.
  - >-
    CLOSED_BY_M23: GA re-certification — rc.3 candidate 0.1.0-rc.3 @ 22a6766 recorded in GA-READINESS.yaml (GO_WITH_DOCUMENTED_DEBT, NOT_PUBLISHED, no tag), smoke test injectable backends/honest zeros/no-publish/iOS deferred (ga-smoke.test.ts 6 tests), 5-documented debts, v0.1.0-rc.1 untouched.
  - >-
    ENVIRONMENT_DEFERRED: M8 iOS requires macOS/Xcode/simulator (no macOS runtime available). No other adapter family is deferred — Electron, Windows/UIA, CLI/PTY, Android, and Web are all proven real (Electron: Windows host + Xvfb fleet proof on e1e0864).
  - >-
    PRODUCT_DECISION_REQUIRED: none currently; any future provider or release
    authorization change must remain explicit and must not be inferred.

