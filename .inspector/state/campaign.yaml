blockers: []
known_debt:
  - >-
    Replay oracle is loose: TargetFailureOracle counts any target-failure
    outcome (including ACTION_FAILED automation misses) as reproduction, so
    minimization can over-reduce paths that end in a hidden-element miss.
    Partially mitigated by the M4 OracleSuite; full tightening deferred.
  - >-
    Web exploration E2E takes ~4-6 min wall clock (fresh Chromium per replay);
    acceptable for the gate but a candidate for later perf work.

hardening:
  active: false
  saved_implementation_waypoint: null
  scope: null

stop_conditions:
  - unavailable_required_secret_or_login
  - irreversible_external_action_without_authority
  - publish_merge_or_release_without_authority
  - unresolved_material_product_decision
  - security_boundary_would_need_weakening
  - licensing_conflict
  - required_hardware_or_os_unavailable_with_no_independent_work
  - irreconcilable_authoritative_contracts
  - deterministic_gate_failure_with_no_safe_forward_path

next_milestone_after_completion: M7
