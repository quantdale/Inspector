      required.
  - id: WEB-K1
    opened: "2026-08-22"
    closed: "this session"
    kind: test-determinism
    detail: >-
      CLOSED: pageerror-during-failing-action classification. Root cause
      was a racy TEST (crash timer 25ms vs act-entry latency), not a
      product defect - when the crash landed pre-window it was correctly
      unattributed per the K2 discipline. Test made deterministic (crash
      at 2s inside a ~10.5s click window); product code unchanged.
      Evidence: failed once in rc-work final-integration.log; green 3x
      isolated + full-suite green on c338a40; post-fix green 5x isolated
      + suite-load green.
  - id: WIN-UIA-PAINT
    opened: "2026-08-22"
    closed: "this session"
    kind: product-lifecycle
    detail: >-
      CLOSED: real UIA Paint 'STALE_ELEMENT: attached window is gone'.
      Root cause: Win11 Paint rehosts/destroys its top-level HWND
      mid-session while the pid stays alive; cached-window ops then fail.
      Product fix in RealUiaBackend: one bounded reattach+retry for
      ROOT-level staleness only, gated on pid liveness + surviving
      top-level window; element-level staleness never retried; dead
      targets stay DEAD_WINDOW. Regression coverage:
      windows.stale-window.test.ts. Post-fix: real-Paint integration
      green repeatedly incl. suite load.

