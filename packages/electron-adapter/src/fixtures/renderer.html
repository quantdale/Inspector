<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inspector Electron Fixture</title></head>
<body>
  <h1>Inspector Electron Fixture</h1>
  <input id="username" aria-label="username">
  <input id="password" aria-label="password" type="password">
  <button id="loginBtn">Log in</button>
  <p id="loginMsg" aria-live="polite"></p>
  <section id="dashboard" hidden>
    <button id="increment">Increment</button>
    <span id="count">0</span>
    <button id="save">Save preference</button>
    <button id="boom">Trigger crash</button>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);
    let count = 0;
    $('loginBtn').addEventListener('click', () => {
      const user = $('username').value;
      const password = $('password').value;
      if (user === 'CRASH' || user.length >= 64) throw new Error('ElectronFixtureValidationCrash');
      if (!user || !password) { $('loginMsg').textContent = 'invalid credentials'; return; }
      $('loginBtn').hidden = true;
      $('username').hidden = true;
      $('password').hidden = true;
      $('dashboard').hidden = false;
    });
    $('increment').addEventListener('click', () => {
      count += 1;
      $('count').textContent = String(count);
      if (count >= 3) throw new Error('ElectronFixtureIncrementCrash');
    });
    $('save').addEventListener('click', () => localStorage.setItem('pref', 'saved-' + count));
    $('boom').addEventListener('click', () => { throw new Error('ElectronFixtureTargetCrash'); });
  </script>
</body>
</html>
